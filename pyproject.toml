[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvielle"
version = "2.5.0"
description = "D'Vielle — Intelligent Vigilance, a free local Windows guardian"
readme = "README.md"
requires-python = ">=3.12,<3.15,!=3.13.*"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ravikant R. T.", email = "kt.tradingsystem@gmail.com" },
]
maintainers = [
    { name = "Ravikant R. T.", email = "kt.tradingsystem@gmail.com" },
]
keywords = ["windows", "privacy", "security", "guardian"]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "psutil>=5.9.8",
    "PyYAML>=6.0.1",
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
    "cryptography>=41",
    "packaging>=24.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dvielle = "dvielle.__main__:main"
dvielle-headless = "agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "dvielle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
