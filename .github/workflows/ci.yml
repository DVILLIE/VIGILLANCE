name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows]"
          pip install pytest ruff
      - name: Ruff (selected)
        run: ruff check agent tests --select E9,F63,F7,F82
      - name: Pytest
        run: python -m pytest -q --tb=short
      - name: PowerShell syntax — installer
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/installer/install-dvielle.ps1",
            [ref]$null,
            [ref]$errs
          )
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
