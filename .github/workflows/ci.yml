name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows,dev]"
      - name: Installation smoke (no host collection)
        run: python scripts/smoke_test.py
      - name: Ruff (selected)
        run: ruff check agent dvielle tests scripts/smoke_test.py scripts/verify_runtime.py --select E9,F63,F7,F82
      - name: Pytest
        run: python -m pytest -q --tb=short
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem installer,scripts -Filter *.ps1 -Recurse) {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errs
            )
            if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          }
  browser:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
