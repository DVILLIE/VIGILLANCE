# DVielle — DEEP VIGILLANCE main configuration
# Lives at C:\DVILLIE\config\config.yaml after install (data under C:\DVILLIE\data)

agent:
  name: DVielle
  display_name: DVielle — DEEP VIGILLANCE
  interval_seconds: 60          # pulse default (network/process correlation)
  process_priority: below_normal # idle | below_normal | normal
  baseline_days: 7              # learning period before auto-actions allowed
  data_dir: null                # null = auto (C:\DVILLIE\data)

# Adaptive Nerve — per-collector cadence (see docs/VIGILLANCE_FUTURE_ARCHITECTURE.md)
# Heartbeat is cheap counters only — never a full scan.
nerve:
  heartbeat_seconds: 5
  pulse_seconds: 60
  idle_deep_seconds: 900

modes:
  monitor_only: true            # observe/recommend; Level ≥2 requires Cortex Decision ID
  enable_toasts: true
  enable_auto_block: false      # even if true, AttackMonitor only RECOMMENDS (P0)
  enable_ram_trim: false        # P0.1: automatic trim DISABLED regardless
  enable_disk_cleanup: false
  enable_microsoft_guard: true

thresholds:
  ram_critical_percent: 90
  ram_sustained_checks: 3
  ram_alert_percent: 85
  cpu_alert_percent: 80
  disk_low_percent: 15
  failed_logon_block_after: 5
  failed_logon_window_minutes: 15

# Audit #2.2 — Attacks Console honesty + store self-budget
attacks:
  review_window_hours: 24       # FLAGGED peer-dedup horizon
  summary_window_days: 14       # attack_summary historical counts (labeled)

# Age out high-volume tables on idle_deep. Never prune decisions / action_audit /
# action_decisions / blocked_ips / baseline_processes / agent_cursors / work_log.
retention:
  connections_days: 7
  events_days: 14
  health_snapshots_days: 14
  failed_logons_days: 30

resource_advisor:
  enabled: true
  toast_cooldown_seconds: 300

# Privacy adapter — remediation flags are OBSERVE→RECOMMEND only until Cortex+Executor (P0)
microsoft_guard:
  strict_mode: true
  auto_remediate_registry: false
  block_telemetry_firewall: false
  block_telemetry_connections: false
  disable_telemetry_services: false
  preserve_windows_update: true

modules:
  connections: true
  attacks: true
  browser_guard: true          # watch for stealers/adware while browsing (no keylogging)
  ram: true
  disk: true
  security: true
  privacy_guard: true
  resource_advisor: true
  microsoft_guard: true
  network_info: true
  # Stubs removed from v1 — flags reserved for future
  # usb_watch: false
  # dns_cache: false

browser_guard:
  enabled: true
  check_ad_sidecars: false   # optional; reverse-DNS of peers is slow
  # Defensive only: process/path heuristics. Never captures passwords or keystrokes.

logging:
  level: INFO
  max_file_mb: 10
  backup_count: 3

# Chat / VILL deferred until core guardian is solid
chat:
  enabled: false
  ollama_model: llama3.2
  voice_web_only: true
  # Privacy (audit C2): chat is on-device (local Ollama) by default.
  allow_cloud_llm: false          # true + GROQ_API_KEY set → may use Groq cloud when local Ollama is unavailable
  allow_cloud_raw_context: false  # true → send UNREDACTED machine/network identity to the cloud (not recommended)
  ollama_timeout_seconds: 5       # fail fast to the local explainer instead of hanging
