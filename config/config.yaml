# DVielle — DEEP VIGILLANCE main configuration
# Lives at C:\DVILLIE\config\config.yaml after install (data under C:\DVILLIE\data)

agent:
  name: DVielle
  display_name: DVielle — DEEP VIGILLANCE
  interval_seconds: 60          # poll interval (30–300 recommended)
  process_priority: below_normal # idle | below_normal | normal
  baseline_days: 7              # learning period before auto-actions allowed
  data_dir: null                # null = auto (C:\DVILLIE\data)

modes:
  monitor_only: true            # v1 default: log only, no destructive actions
  enable_toasts: true           # Windows toast on critical alerts (Win10+)
  enable_auto_block: false      # set true after baseline + testing
  enable_ram_trim: false        # rare; standby flush hurts more than it helps
  enable_disk_cleanup: false    # set true in v2; runs only when disk < threshold
  enable_microsoft_guard: true  # reduce telemetry; never block Windows Update

thresholds:
  ram_critical_percent: 90      # sustained RAM % before trim (if enabled)
  ram_sustained_checks: 3       # consecutive checks above threshold
  ram_alert_percent: 85         # popup when RAM above this
  cpu_alert_percent: 80         # popup when CPU above this
  disk_low_percent: 15          # free space % triggers cleanup alert
  failed_logon_block_after: 5   # attempts from same IP before auto-block

resource_advisor:
  enabled: true
  toast_cooldown_seconds: 300   # min seconds between same-type popups (5 min)

microsoft_guard:
  strict_mode: true               # reduce telemetry uploads (not "zero Microsoft")
  auto_remediate_registry: true   # re-apply privacy registry if Microsoft resets it
  block_telemetry_firewall: true  # outbound firewall for telemetry programs/domains
  block_telemetry_connections: true  # terminate active telemetry uploads
  disable_telemetry_services: true   # stop DiagTrack etc. when safe
  # Never block these (Windows Update / delivery / certificates)
  preserve_windows_update: true

modules:
  connections: true
  attacks: true
  browser_guard: true          # watch for stealers/adware while browsing (no keylogging)
  ram: true
  disk: true
  security: true
  privacy_guard: true
  resource_advisor: true
  microsoft_guard: true
  network_info: true
  # Stubs removed from v1 — flags reserved for future
  # usb_watch: false
  # dns_cache: false

browser_guard:
  enabled: true
  check_ad_sidecars: false   # optional; reverse-DNS of peers is slow
  # Defensive only: process/path heuristics. Never captures passwords or keystrokes.

logging:
  level: INFO
  max_file_mb: 10
  backup_count: 3

# Chat / VILL deferred until core guardian is solid
chat:
  enabled: false
  ollama_model: llama3.2
  voice_web_only: true
