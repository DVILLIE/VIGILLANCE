# DVielle — DEEP VIGILLANCE main configuration
# Lives at C:\DVILLIE\config\config.yaml after install (data under C:\DVILLIE\data)

agent:
  name: DVielle
  display_name: DVielle — DEEP VIGILLANCE
  interval_seconds: 60          # pulse default (network/process correlation)
  process_priority: below_normal # idle | below_normal | normal
  baseline_days: 7              # reserved history horizon; never enables mutations
  data_dir: null                # null = auto (C:\DVILLIE\data)

# Adaptive Nerve — per-collector cadence (see docs/VIGILLANCE_FUTURE_ARCHITECTURE.md)
# Heartbeat is cheap counters only — never a full scan.
nerve:
  heartbeat_seconds: 5
  pulse_seconds: 60
  idle_deep_seconds: 900
  max_workers: 2               # bounded, with a worker reserved for core monitoring
  collectors:
    attacks: 30
    security: 120
    connections: 60
    browser_guard: 120
    resource_advisor: 60
    ram: 60
    disk: 300
    privacy_guard: 300
    microsoft_guard: 300
    network_info: 300

# Agent CPU is normalized to total logical CPU capacity. Sustained excess defers
# optional collection; this is measured scheduling, not an OS-enforced quota.
# analysis_cpu_percent is the published helper Job Object hard cap (CpuRate = percent * 100).
# The resident Limited task does not assign that job. It does not terminate user apps.
budget:
  max_cpu_percent: 1.0
  max_rss_mb: 150
  analysis_cpu_percent: 20

workload:
  busy_cpu_percent: 80
  idle_after_seconds: 120
  # Names only guide conservative scheduling, never grant security trust.
  protected_foreground_processes:
    - ollama.exe
    - Cursor.exe
    - claude.exe

network:
  allow_public_ip_lookup: false # opt in to an external public-IP service

modes:
  monitor_only: true            # observe/recommend; Level ≥2 requires Cortex Decision ID
  enable_toasts: true
  enable_auto_block: false      # even if true, AttackMonitor only RECOMMENDS (P0)
  enable_ram_trim: false        # P0.1: automatic trim DISABLED regardless
  enable_disk_cleanup: false
  enable_microsoft_guard: true

thresholds:
  ram_critical_percent: 90
  ram_sustained_checks: 3
  ram_alert_percent: 85
  cpu_alert_percent: 80
  disk_low_percent: 15
  failed_logon_block_after: 5
  failed_logon_window_minutes: 15

# Audit #2.2 — Attacks Console honesty + store self-budget
attacks:
  review_window_hours: 24       # FLAGGED peer-dedup horizon
  summary_window_days: 14       # attack_summary historical counts (labeled)

# Bounded scheduled retention. Decisions, action audits, and block policy persist.
retention:
  connections_days: 7
  events_days: 14
  health_snapshots_days: 14
  failed_logons_days: 30
  work_log_days: 14
  privacy_checks_days: 14
  twin_max_mb: 5               # current history plus one rotated backup

resource_advisor:
  enabled: true
  toast_cooldown_seconds: 300
  # Apps here are NEVER offered for closing and NEVER counted as pulse offenders,
  # even when they are the heaviest process. Foreground apps + their family are
  # already protected automatically; this is for background tools you want kept
  # alive regardless (agents, editors, long-running jobs). Case-insensitive, .exe
  # names. Suggestions: powershell.exe, pwsh.exe, python.exe, node.exe, ollama.exe,
  # Docker Desktop.exe, wsl.exe.
  never_close:
    - claude.exe
    - Cursor.exe

# Privacy adapter — remediation flags are OBSERVE→RECOMMEND only until Cortex+Executor (P0)
microsoft_guard:
  strict_mode: true
  auto_remediate_registry: false
  block_telemetry_firewall: false
  block_telemetry_connections: false
  disable_telemetry_services: false
  preserve_windows_update: true

modules:
  connections: true
  attacks: true
  browser_guard: true          # watch for stealers/adware while browsing (no keylogging)
  ram: true
  disk: true
  security: true
  privacy_guard: true
  resource_advisor: true
  microsoft_guard: true
  network_info: true
  # Stubs removed from v1 — flags reserved for future
  # usb_watch: false
  # dns_cache: false

browser_guard:
  enabled: true
  check_ad_sidecars: false   # optional; reverse-DNS of peers is slow
  # Defensive only: process/path heuristics. Never captures passwords or keystrokes.

logging:
  level: INFO
  max_file_mb: 10
  backup_count: 3

# Free intel. Local files only unless fetch_enabled is turned on by a caller.
# abuse.ch stays off. DVielle does not bundle those dumps.
intel:
  fetch_enabled: false
  abuse_ch_enabled: false

# Chat / VILL deferred until core guardian is solid
chat:
  enabled: false
  ollama_model: llama3.2
  voice_web_only: true
  # Privacy (audit C2): chat is on-device (local Ollama) by default.
  allow_cloud_llm: false          # true + GROQ_API_KEY set → may use Groq cloud when local Ollama is unavailable
  allow_cloud_raw_context: false  # true → send UNREDACTED machine/network identity to the cloud (not recommended)
  allow_cloud_speech: false
  speech_backend: disabled      # disabled | local (optional PocketSphinx) | google (requires opt-in)
  allow_web_search: false
  ollama_timeout_seconds: 5       # fail fast to the local explainer instead of hanging
